# Local PostgreSQL for this project.
# Values come from .env (see .env.example); nothing secret lives in this file.
services:
  postgres:
    image: postgres:16
    container_name: uk_employer_intel_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host port : container port
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume so the database survives container restarts.
      - pgdata:/var/lib/postgresql/data
      # Raw downloads, read-only. This lets PostgreSQL's own COPY read the
      # files directly from inside the container, which is much faster than
      # streaming every row through Python.
      - ./data/raw:/data/raw:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
